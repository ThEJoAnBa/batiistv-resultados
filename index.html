<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BATIISTV - Resultados de fútbol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f1f3f5;
      color: #111;
    }

    header {
      background: #0b7a3b;
      color: white;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 14px;
      opacity: .9;
      margin-top: 4px;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .date {
      background: white;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .date button {
      border: none;
      background: #0b7a3b;
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .date button:hover {
      opacity: .9;
    }

    #fechaActual {
      text-align: center;
      font-size: 18px;
      text-transform: capitalize;
    }

    .league {
      background: white;
      border-radius: 12px;
      margin-bottom: 22px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.07);
    }

    .league-header {
      background: #0b7a3b;
      color: white;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: 800;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 110px 1fr;
      align-items: center;
      min-height: 78px;
      padding: 14px 20px;
      border-bottom: 1px solid #eeeeee;
    }

    .match:last-child {
      border-bottom: none;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 15px;
    }

    .team.home {
      justify-content: flex-end;
      text-align: right;
    }

    .team.away {
      justify-content: flex-start;
    }

    .team img {
      width: 38px;
      height: 38px;
      object-fit: contain;
    }

    .center {
      text-align: center;
    }

    .time {
      font-size: 18px;
      font-weight: 900;
    }

    .status {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      font-weight: 600;
      color: #777;
    }

    .no-games {
      padding: 20px;
      text-align: center;
      color: #888;
      font-size: 14px;
    }

    .error {
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: #c00;
    }

    footer {
      text-align: center;
      padding: 35px 15px;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 650px) {

      .date {
        flex-direction: column;
      }

      .date button {
        width: 100%;
      }

      .match {
        grid-template-columns: 1fr 65px 1fr;
        padding: 12px 10px;
      }

      .team {
        font-size: 12px;
        gap: 6px;
      }

      .team img {
        width: 30px;
        height: 30px;
      }

      .time {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <div>
      <div class="logo">BATIISTV</div>
      <div class="subtitle">Resultados de fútbol</div>
    </div>
  </div>
</header>

<main class="container">

  <div class="date">

    <button onclick="cambiarDia(-1)">
      ← Ayer
    </button>

    <strong id="fechaActual">
      Hoy
    </strong>

    <button onclick="cambiarDia(1)">
      Mañana →
    </button>

  </div>

  <div id="contenedor">
    <div class="no-games">
      Cargando partidos...
    </div>
  </div>

</main>

<footer>
  BATIISTV · Resultados de fútbol
</footer>

<script>

const COMPETICIONES = {
  PL: "Premier League",
  PD: "LaLiga",
  BL1: "Bundesliga",
  SA: "Serie A",
  FL1: "Ligue 1",
  CL: "Champions League",
  EL: "Europa League",
  PPL: "Primeira Liga",
  ELC: "Championship",
  BSA: "Brasileirão",
  WC: "Mundial",
  EC: "Eurocopa"
};

let fechaSeleccionada = new Date();

function formatoFecha(fecha) {

  const año = fecha.getFullYear();

  const mes =
    String(fecha.getMonth() + 1).padStart(2, "0");

  const dia =
    String(fecha.getDate()).padStart(2, "0");

  return `${año}-${mes}-${dia}`;
}

function mostrarFecha() {

  const ahora = new Date();

  const elemento =
    document.getElementById("fechaActual");

  const seleccionada =
    formatoFecha(fechaSeleccionada);

  const hoy =
    formatoFecha(ahora);

  if (seleccionada === hoy) {

    elemento.textContent = "Hoy";

    return;
  }

  elemento.textContent =
    fechaSeleccionada.toLocaleDateString(
      "es-ES",
      {
        weekday: "long",
        day: "numeric",
        month: "long"
      }
    );
}

function cambiarDia(dias) {

  fechaSeleccionada.setDate(
    fechaSeleccionada.getDate() + dias
  );

  mostrarFecha();

  cargarPartidos();
}

async function cargarPartidos() {

  const contenedor =
    document.getElementById("contenedor");

  contenedor.innerHTML = `
    <div class="no-games">
      Cargando partidos...
    </div>
  `;

  try {

    const fecha =
      formatoFecha(fechaSeleccionada);

    const respuesta =
      await fetch(
        `/api/football?date=${fecha}`
      );

    if (!respuesta.ok) {

      throw new Error(
        "Error HTTP " + respuesta.status
      );

    }

    const datos =
      await respuesta.json();

    console.log(
      "Datos recibidos:",
      datos
    );

    const partidos =
      datos.matches || [];

    if (!partidos.length) {

      contenedor.innerHTML = `
        <div class="no-games">
          No hay partidos disponibles para este día.
        </div>
      `;

      return;
    }

    const grupos = {};

    partidos.forEach(partido => {

      const codigo =
        partido.competition?.code;

      if (!COMPETICIONES[codigo]) {
        return;
      }

      if (!grupos[codigo]) {
        grupos[codigo] = [];
      }

      grupos[codigo].push(partido);

    });

    contenedor.innerHTML = "";

    Object.entries(COMPETICIONES)
      .forEach(([codigo, nombre]) => {

        const partidosLiga =
          grupos[codigo] || [];

        if (!partidosLiga.length) {
          return;
        }

        const ligaHTML =
          document.createElement("div");

        ligaHTML.className =
          "league";

        ligaHTML.innerHTML = `
          <div class="league-header">
            ${nombre}
          </div>
        `;

        partidosLiga.forEach(partido => {

          const local =
            partido.homeTeam?.name ||
            "Local";

          const visitante =
            partido.awayTeam?.name ||
            "Visitante";

          const logoLocal =
            partido.homeTeam?.crest ||
            "";

          const logoVisitante =
            partido.awayTeam?.crest ||
            "";

          const estado =
            partido.status ||
            "SCHEDULED";

          let hora = "";

          if (partido.utcDate) {

            const fecha =
              new Date(partido.utcDate);

            hora =
              fecha.toLocaleTimeString(
                "es-ES",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              );
          }

          let marcador = hora;

          if (
            estado === "IN_PLAY" ||
            estado === "PAUSED" ||
            estado === "FINISHED"
          ) {

            marcador = `
              ${partido.score?.fullTime?.home ?? 0}
              -
              ${partido.score?.fullTime?.away ?? 0}
            `;
          }

          let estadoTexto =
            "Programado";

          if (estado === "IN_PLAY") {
            estadoTexto =
              "EN DIRECTO";
          }

          if (estado === "PAUSED") {
            estadoTexto =
              "DESCANSO";
          }

          if (estado === "FINISHED") {
            estadoTexto =
              "Finalizado";
          }

          if (estado === "POSTPONED") {
            estadoTexto =
              "Aplazado";
          }

          const partidoHTML =
            document.createElement("div");

          partidoHTML.className =
            "match";

          partidoHTML.innerHTML = `

            <div class="team home">

              <span>
                ${local}
              </span>

              ${
                logoLocal
                  ? `<img
                      src="${logoLocal}"
                      alt="${local}"
                    >`
                  : ""
              }

            </div>

            <div class="center">

              <div class="time">
                ${marcador}
              </div>

              <span class="status">
                ${estadoTexto}
              </span>

            </div>

            <div class="team away">

              ${
                logoVisitante
                  ? `<img
                      src="${logoVisitante}"
                      alt="${visitante}"
                    >`
                  : ""
              }

              <span>
                ${visitante}
              </span>

            </div>
          `;

          ligaHTML.appendChild(
            partidoHTML
          );

        });

        contenedor.appendChild(
          ligaHTML
        );

      });

    if (!contenedor.children.length) {

      contenedor.innerHTML = `
        <div class="no-games">
          No hay partidos de las competiciones seleccionadas para este día.
        </div>
      `;
    }

  } catch (error) {

    console.error(error);

    contenedor.innerHTML = `
      <div class="error">
        No se pudieron cargar los partidos.
      </div>
    `;
  }
}

mostrarFecha();

cargarPartidos();

</script>

</body>
</html>
