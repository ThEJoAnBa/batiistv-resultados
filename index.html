<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BATIISTV - Resultados de fútbol</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111;
    }

    header {
      background: #168c45;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 950px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .date {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: bold;
    }

    .league {
      background: white;
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .league-header {
      background: #168c45;
      color: white;
      padding: 13px 16px;
      font-weight: bold;
      font-size: 17px;
    }

    .match {
      display: grid;
      grid-template-columns: 1fr 120px 1fr;
      align-items: center;
      padding: 17px 15px;
      border-bottom: 1px solid #eee;
    }

    .match:last-child {
      border-bottom: none;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }

    .team.home {
      justify-content: flex-end;
      text-align: right;
    }

    .team.away {
      justify-content: flex-start;
    }

    .team img {
      width: 34px;
      height: 34px;
      object-fit: contain;
    }

    .center {
      text-align: center;
      font-weight: bold;
    }

    .time {
      font-size: 18px;
    }

    .status {
      display: block;
      margin-top: 5px;
      font-size: 12px;
      color: #777;
      font-weight: normal;
    }

    .no-games {
      padding: 18px;
      text-align: center;
      color: #777;
    }

    .error {
      background: white;
      padding: 25px;
      border-radius: 10px;
      text-align: center;
      color: #c00;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      .match {
        grid-template-columns: 1fr 75px 1fr;
      }

      .team {
        font-size: 13px;
      }

      .team img {
        width: 28px;
        height: 28px;
      }

      .time {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>BATIISTV</h1>
  <p>Resultados de fútbol</p>
</header>

<main class="container">

  <div class="date">
    Partidos de hoy
  </div>

  <div id="contenedor">
    <div class="no-games">
      Cargando partidos...
    </div>
  </div>

</main>

<footer>
  BATIISTV · Resultados de fútbol
</footer>

<script>

const COMPETICIONES = {
  PL: "Premier League",
  PD: "LaLiga",
  BL1: "Bundesliga",
  SA: "Serie A",
  FL1: "Ligue 1",
  CL: "Champions League",
  EL: "Europa League",
  PPL: "Primeira Liga",
  ELC: "Championship",
  BSA: "Brasileirão",
  WC: "Mundial",
  EC: "Eurocopa"
};

async function cargarPartidos() {

  const contenedor = document.getElementById("contenedor");

  try {

    const respuesta = await fetch("/api/football");

    if (!respuesta.ok) {
      throw new Error("Error HTTP " + respuesta.status);
    }

    const datos = await respuesta.json();

    console.log("Datos recibidos:", datos);

    const partidos = datos.matches || [];

    if (!partidos.length) {

      contenedor.innerHTML = `
        <div class="no-games">
          No hay partidos disponibles.
        </div>
      `;

      return;
    }

    const grupos = {};

    partidos.forEach(partido => {

      const codigo =
        partido.competition?.code;

      if (!COMPETICIONES[codigo]) {
        return;
      }

      if (!grupos[codigo]) {
        grupos[codigo] = [];
      }

      grupos[codigo].push(partido);

    });

    contenedor.innerHTML = "";

    Object.entries(COMPETICIONES).forEach(
      ([codigo, nombre]) => {

        const partidosLiga =
          grupos[codigo] || [];

        const ligaHTML =
          document.createElement("div");

        ligaHTML.className = "league";

        ligaHTML.innerHTML = `
          <div class="league-header">
            ${nombre}
          </div>
        `;

        if (!partidosLiga.length) {

          ligaHTML.innerHTML += `
            <div class="no-games">
              No hay partidos hoy
            </div>
          `;

        } else {

          partidosLiga.forEach(partido => {

            const local =
              partido.homeTeam?.name ||
              "Local";

            const visitante =
              partido.awayTeam?.name ||
              "Visitante";

            const logoLocal =
              partido.homeTeam?.crest ||
              "";

            const logoVisitante =
              partido.awayTeam?.crest ||
              "";

            const estado =
              partido.status ||
              "SCHEDULED";

            let hora = "";

            if (partido.utcDate) {

              const fecha =
                new Date(partido.utcDate);

              hora =
                fecha.toLocaleTimeString(
                  "es-ES",
                  {
                    hour: "2-digit",
                    minute: "2-digit"
                  }
                );

            }

            let marcador = hora;

            if (
              estado === "IN_PLAY" ||
              estado === "PAUSED" ||
              estado === "FINISHED"
            ) {

              marcador = `
                ${partido.score?.fullTime?.home ?? 0}
                -
                ${partido.score?.fullTime?.away ?? 0}
              `;

            }

            let estadoTexto = "Programado";

            if (estado === "IN_PLAY") {
              estadoTexto = "EN DIRECTO";
            }

            if (estado === "PAUSED") {
              estadoTexto = "DESCANSO";
            }

            if (estado === "FINISHED") {
              estadoTexto = "Finalizado";
            }

            if (estado === "POSTPONED") {
              estadoTexto = "Aplazado";
            }

            const partidoHTML =
              document.createElement("div");

            partidoHTML.className = "match";

            partidoHTML.innerHTML = `

              <div class="team home">

                <span>
                  ${local}
                </span>

                ${
                  logoLocal
                    ? `<img
                        src="${logoLocal}"
                        alt="${local}"
                      >`
                    : ""
                }

              </div>

              <div class="center">

                <div class="time">
                  ${marcador}
                </div>

                <span class="status">
                  ${estadoTexto}
                </span>

              </div>

              <div class="team away">

                ${
                  logoVisitante
                    ? `<img
                        src="${logoVisitante}"
                        alt="${visitante}"
                      >`
                    : ""
                }

                <span>
                  ${visitante}
                </span>

              </div>

            `;

            ligaHTML.appendChild(partidoHTML);

          });

        }

        contenedor.appendChild(ligaHTML);

      }
    );

  } catch (error) {

    console.error(error);

    contenedor.innerHTML = `
      <div class="error">
        No se pudieron cargar los resultados.
      </div>
    `;

  }

}

cargarPartidos();

</script>

</body>
</html>
